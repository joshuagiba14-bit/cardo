services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cardo
      POSTGRES_PASSWORD: cardo
      POSTGRES_DB: cardo
    ports:
      - "5432:5432"
    volumes:
      - cardo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cardo -d cardo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cardo_pgdata:
